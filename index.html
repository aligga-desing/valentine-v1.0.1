<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine 💕</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #ffe6f0;
            overflow: hidden;
            transition: background 0.5s;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 10;
        }

        h1 {
            color: #ff4f91;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yes {
            background: #ff69a4;
            color: white;
        }

        #yes:hover {
            background: #ff3f89;
            transform: scale(1.08);
        }

        #no {
            background: #eee;
            color: #555;
        }

        #no:hover {
            transform: scale(1.05);
        }

        .kiss {
            position: fixed;
            font-size: 40px;
            animation: fall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .sad {
            font-size: 100px;
            animation: sadAnimation 0.5s ease;
        }

        @keyframes sadAnimation {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

    <div class="container" id="box">
        <h1>Would you like to be my Valentine? 💕</h1>

        <button id="yes" onclick="sayYes()">Yes 💖</button>
        <button id="no" onclick="sayNo()">No 💔</button>
    </div>

    <script>
        function sayYes() {
            document.body.style.background = "#ff1744";

            document.getElementById("box").innerHTML = `
                <h1 style="color:#ff1744;">YAYYY! ❤️💋</h1>
                <p style="font-size:25px;">You said YES! 🥰</p>
            `;

            // Create lots of kisses
            for (let i = 0; i < 80; i++) {
                const kiss = document.createElement("div");

                kiss.className = "kiss";
                kiss.innerHTML = "💋";

                kiss.style.left = Math.random() * 100 + "vw";
                kiss.style.animationDelay = Math.random() * 2 + "s";
                kiss.style.fontSize = (25 + Math.random() * 35) + "px";

                document.body.appendChild(kiss);

                setTimeout(() => {
                    kiss.remove();
                }, 5000);
            }
        }

      function sayNo() { 
    document.getElementById("box").innerHTML = ` 
        <img src="/home/ziyad/Downloads/ahok.jpeg">
        <h1>ah ok 🥀</h1>
    `;
    
        }
    </script>

</body>
</html>
